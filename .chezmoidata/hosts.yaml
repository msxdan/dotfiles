# Per-host package lists. Machines do not share packages: each host names exactly
# what it wants, and nothing is inherited from another host.
#
# The key is the lowercased hostname. A host that is not listed here falls back to
# "default" and the install script says so explicitly, so a hostname typo is visible
# rather than silently installing the wrong set.
#
# Every host MUST define all nine keys, even if empty -- the templates index them
# directly. tenv entries are "kind@version".
#
# services / user_services are unit names, enabled and started after the packages
# land; a unit whose package failed to install is skipped rather than erroring.
# System units go through sudo, user units do not, which is why they are separate
# lists. groups are added to $USER and take effect on the next login.
#
# vscode entries are marketplace extension IDs ("publisher.name"), installed with
# `code --install-extension`. They need a `code` binary from the pacman or aur list,
# and the extensions resolve against whichever marketplace that build points at.
#
# macOS is deliberately absent: it keeps using ~/.brewfile via `brew bundle`.
#
# Package names verified against the CachyOS pacman sync DB and the AUR.
hosts:
  # Headless fallback: enough to have a working shell and edit files, nothing more.
  default:
    pacman:
    - git
    - zsh
    - openssh
    - age
    - gnupg # dot_gitconfig sets commit.gpgsign, so git cannot commit without it
    - neovim
    - tmux
    - starship
    - zoxide
    - mise
    - fzf
    - lsd
    - bat
    - ripgrep
    - jq
    - htop
    aur: []
    pipx: []
    mise: []
    tenv: []
    services: []
    # Shipped by dot_config/systemd/user/ on every Linux host, so it is enabled even
    # on the headless fallback: git over ssh needs the agent wherever this applies.
    user_services:
    - ssh-agent.service
    groups: []
    vscode: [] # headless: no editor GUI here

  # CachyOS workstation. Scoped to what this repo's own configs reference, plus what
  # was already installed by hand (see .notes/installed-cachyos.md). Anything else
  # from the macOS Brewfile is in the catalogue at the bottom of this file -- move a
  # line up into this list when it is actually wanted.
  cachyos:
    pacman:
    # Shell and CLI referenced by dot_zshrc / dot_aliasrc
    - git
    - zsh
    - openssh
    - age
    - gnupg # dot_gitconfig sets commit.gpgsign, so git cannot commit without it
    - neovim # $EDITOR, dot_config/nvim, alias vim=nvim
    # image.nvim, pulled in by the neo-tree spec, needs ImageMagick and the magick
    # luarock. Without a system luarocks, lazy.nvim bootstraps rocks via hererocks,
    # which downloads a prebuilt Lua that can demand a newer glibc than Arch ships.
    - imagemagick
    - luarocks
    # nvim-treesitter's main branch compiles every parser from source and shells
    # out to the tree-sitter CLI to do it.
    - tree-sitter-cli
    - tmux # dot_config/tmux
    - starship # dot_config/starship.toml
    - zoxide # alias cd=z
    - mise # activated from .zshrc
    - fzf # fzf-tab
    - lsd # alias ls=lsd, dot_config/lsd
    - yazi # yy() helper, dot_config/yazi
    - bat
    - ripgrep
    - jq
    - yq
    # Terminal
    - kitty # dot_config/kitty
    - ttf-jetbrains-mono-nerd # glyphs for kitty/starship
    # Tools whose config or shell completion this repo ships
    - github-cli # dot_config/gh
    - pgcli # dot_config/pgcli
    - kubectl # .zshrc completion, $KUBECONFIG assembly
    - kubectx # alias kc=kubectx and kns=kubens; one package provides both
    - k9s # dot_config/k9s
    - helm # .zshrc completion, helm repositories.yaml
    - docker # dot_docker/config.json, .zshrc completion
    - docker-compose
    - containerd
    # Desktop / KDE
    - solaar # dot_config/solaar
    - qt6-tools # qdbus6, used by the Solaar rules
    - kde-cli-tools # kwriteconfig6, used by the KDE settings script
    - ksshaskpass # ssh passphrase prompts without a terminal
    - krdp
    - flameshot
    - kind
    - k6
    - obsidian
    - dive
    - docker-buildx
    - ollama
    - talosctl
    aur:
    - docker-credential-secretservice # ~/.docker/config.json credsStore on Linux
    # Microsoft's build rather than the repos' code (Code - OSS): only this one
    # talks to the real marketplace, and the extension list below needs it. It
    # conflicts with `code`, which must be uninstalled first.
    - visual-studio-code-bin
    - slack-desktop
    - purple-bin
    pipx: []
    mise:
    # Not in the official repos and only in the AUR as tenv-bin, but mise can
    # fetch the same upstream release, so it needs no AUR build.
    - aqua:tofuutils/tenv # .zshrc completion; TENV_AUTO_INSTALL handles versions
    - helmfile
    tenv: [] # empty on purpose: TENV_AUTO_INSTALL=true installs on first use
    # Docker needs its daemon running to be usable at all -- the macOS setup gets
    # this from OrbStack instead.
    services:
    - docker.service
    - containerd.service
    user_services:
    - ssh-agent.service
    groups:
    - docker # run docker without sudo
    # Ported from the macOS Brewfile's vscode lines. The six that were commented
    # out individually there are left out: they were already opted out before the
    # block was disabled, and one is marked deprecated upstream.
    vscode:
    - 4ops.terraform
    - ahmadalli.vscode-nginx-conf
    - almenon.arepl
    - astro-build.astro-vscode
    - bartolomesintes.mclibre-org-html-css-extension-pack
    - batisteo.vscode-django
    - bradgashler.htmltagwrap
    - Catppuccin.catppuccin-vsc-icons
    - compilenix.vscode-zonefile
    - compulim.compulim-vscode-closetag
    - dbaeumer.vscode-eslint
    - devsense.composer-php-vscode
    - devsense.phptools-vscode
