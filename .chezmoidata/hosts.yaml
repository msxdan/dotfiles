# Per-host package lists. Machines do not share packages: each host names exactly
# what it wants, and nothing is inherited from another host.
#
# The key is the lowercased hostname. A host that is not listed here falls back to
# "default" and the install script says so explicitly, so a hostname typo is visible
# rather than silently installing the wrong set.
#
# Every host MUST define all five keys, even if empty -- the templates index them
# directly. tenv entries are "kind@version".
#
# macOS is deliberately absent: it keeps using ~/.brewfile via `brew bundle`.
#
# Package names verified against the CachyOS pacman sync DB and the AUR.
hosts:
  # Headless fallback: enough to have a working shell and edit files, nothing more.
  default:
    pacman:
      - git
      - zsh
      - openssh
      - age
      - neovim
      - tmux
      - starship
      - zoxide
      - mise
      - fzf
      - lsd
      - bat
      - ripgrep
      - jq
      - htop
    aur: []
    pipx: []
    mise: []
    tenv: []

  # CachyOS workstation. Scoped to what this repo's own configs reference, plus what
  # was already installed by hand (see .notes/installed-cachyos.md). Anything else
  # from the macOS Brewfile is in the catalogue at the bottom of this file -- move a
  # line up into this list when it is actually wanted.
  cachyos:
    pacman:
      # Shell and CLI referenced by dot_zshrc / dot_aliasrc
      - git
      - zsh
      - openssh
      - age
      - neovim # $EDITOR, dot_config/nvim, alias vim=nvim
      - tmux # dot_config/tmux
      - starship # dot_config/starship.toml
      - zoxide # alias cd=z
      - mise # activated from .zshrc
      - fzf # fzf-tab
      - lsd # alias ls=lsd, dot_config/lsd
      - yazi # yy() helper, dot_config/yazi
      - bat
      - ripgrep
      - jq
      - yq
      # Terminal
      - kitty # dot_config/kitty
      - ttf-jetbrains-mono-nerd # glyphs for kitty/starship
      # Tools whose config or shell completion this repo ships
      - github-cli # dot_config/gh
      - pgcli # dot_config/pgcli
      - kubectl # .zshrc completion, $KUBECONFIG assembly
      - k9s # dot_config/k9s
      - helm # .zshrc completion, helm repositories.yaml
      - docker # dot_docker/config.json, .zshrc completion
      - docker-compose
      - containerd
      # Desktop / KDE
      - solaar # dot_config/solaar
      - qt6-tools # qdbus6, used by the Solaar rules
      - kde-cli-tools # kwriteconfig6, used by the KDE settings script
      - ksshaskpass # ssh passphrase prompts without a terminal
      - krdp
      - flameshot
    aur:
      - tenv-bin # .zshrc completion; TENV_AUTO_INSTALL handles versions on demand
    pipx: []
    mise: []
    tenv: [] # empty on purpose: TENV_AUTO_INSTALL=true installs on first use

  # Legacy Debian-on-WSL box. Still provisioned by the apt branch, not from here.
  wsl:
    pacman: []
    aur: []
    pipx: []
    mise: []
    tenv: []

